<!DOCTYPE html>
<html>

<head>

<title>SCANOVA Register</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#020617;
font-family:'Inter',sans-serif;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-size:18px;
}

.box{
background:rgba(255,255,255,0.03);
padding:50px;
border-radius:18px;
border:1px solid #1e293b;
width:380px;
text-align:center;
box-shadow:0 0 30px rgba(0,242,255,.15);
}

h2{
font-family:'Orbitron';
color:#00f2ff;
font-size:2rem;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-top:14px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
font-size:1rem;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00f2ff,#00ffa2);
font-weight:bold;
cursor:pointer;
font-size:1.1rem;
transition:.3s;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 20px #00f2ff;
}

p{
margin-top:20px;
color:#94a3b8;
}

</style>

</head>

<body>

<div class="box">

<h2>Create Account</h2>

<form method="POST">

<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Register</button>

</form>

</div>

</body>
</html>
